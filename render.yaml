# Render Blueprint: one web service (Docker) + one Postgres database.
databases:
  - name: pickup-db
    plan: free
    databaseName: pickup
    user: app
services:
  - type: web
    name: pickup-counter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pickup-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGIN # the GitHub Pages site that may call this API
        value: https://abhishekchauhan2904.github.io
      - key: ENABLE_SIMULATOR
        value: "true"
